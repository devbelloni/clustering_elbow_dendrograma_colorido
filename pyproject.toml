[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clustering-demo"
version = "1.0.0"
description = "Choosing the number of clusters: elbow, silhouette, K-Means and dendrograms"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Márcio Belloni" }]
dependencies = ["pandas>=2.1", "numpy>=1.26", "scikit-learn>=1.4", "scipy>=1.11", "matplotlib>=3.8", "seaborn>=0.13"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
clustering-demo = "clustering_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
